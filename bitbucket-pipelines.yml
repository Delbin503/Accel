image: node:22

definitions:
  caches:
    npm: ~/.npm
  steps:
    # Design-system quality gates — run on every pull request.
    - step: &checks
        name: Lint guardrails, changelog, typecheck, tests, build
        clone:
          depth: full          # the changelog check diffs against the PR's target branch
        caches:
          - npm
        script:
          - npm ci
          # packages/ui changes need a CHANGELOG entry (or a version bump)
          - git fetch origin "$BITBUCKET_PR_DESTINATION_BRANCH"
          - npm run lint:changelog
          # Token / layer-name / registry guardrails (must pass)
          - npm run lint:tokens
          - npm run lint:slots
          - npm run lint:components
          - npm run build                 # tsc -b + vite build
          - npm run typecheck:prototypes
          - npm test
          # Full ESLint: React hooks / fast-refresh rules + design-system
          # guardrails (pre-existing guardrail debt is baselined in
          # eslint-suppressions.json; new violations fail).
          - npx eslint .
    - step: &a11y
        name: Accessibility (axe on stories and pages) + visual snapshots (Chromatic)
        clone:
          depth: full          # Chromatic uses git history to find baselines
        caches:
          - npm
        script:
          - apt-get update && apt-get install -y --no-install-recommends chromium
          - npm ci
          - npm run build-storybook -- --quiet
          - CHROME_PATH=/usr/bin/chromium node scripts/check-a11y.mjs
          # Same axe check on every real page (the prototypes render the app pages)
          - CHROME_PATH=/usr/bin/chromium npm run test:a11y:pages
          # Visual snapshots of every story in light + dark. Runs once the
          # CHROMATIC_PROJECT_TOKEN repository variable is set; changes are
          # reviewed in Chromatic, so they don't fail the step.
          - if [ -n "$CHROMATIC_PROJECT_TOKEN" ]; then npm run chromatic -- --storybook-build-dir storybook-static; else echo "Chromatic skipped — set CHROMATIC_PROJECT_TOKEN to enable"; fi
        artifacts:
          - .ds-ops-reports/**

pipelines:
  pull-requests:
    "**":
      - parallel:
          - step: *checks
          - step: *a11y
  branches:
    main:
      - step:
          name: Deploy to Vercel
          image: node:20
          caches:
            - node
          script:
            - npm install
            - npm install -g vercel
            - vercel pull --yes --environment=production --token=$VERCEL_TOKEN
            - CI=false vercel build --prod --token=$VERCEL_TOKEN
            - vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
