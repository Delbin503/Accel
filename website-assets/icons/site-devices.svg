  <title id="t-site-devices">Site &amp; Device Management</title>
  <defs>
    <linearGradient id="g-site-devices" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FF9A4D"/>
      <stop offset="1" stop-color="#FE5C01"/>
    </linearGradient>
  </defs>
  <style>
    .tile-site-devices { fill: #141110; }
    .d-site-devices {
      fill: url(#g-site-devices);
      transform-box: fill-box;
      transform-origin: 50% 50%;
      animation: pulse-site-devices 2.8s ease-in-out infinite;
      will-change: opacity, transform;
    }
    @keyframes pulse-site-devices {
      0%, 100% { opacity: .30; transform: scale(.70); }
      45%      { opacity: 1;   transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .d-site-devices { animation: none; opacity: .92; transform: none; }
    }
  </style>
