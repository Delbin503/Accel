<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="t-explain">
  <title id="t-explain">A detection clip with its written explanation appearing beside it</title>
  <defs>
    <linearGradient id="ex-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A4D"/><stop offset="1" stop-color="#FE5C01"/>
    </linearGradient>
    <linearGradient id="ex-frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A4453"/><stop offset="1" stop-color="#232B36"/>
    </linearGradient>
    <radialGradient id="ex-ground">
      <stop offset="0" stop-color="#B9C4D6" stop-opacity=".40"/>
      <stop offset="1" stop-color="#B9C4D6" stop-opacity="0"/>
    </radialGradient>
    <filter id="ex-sh" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C8CA6" flood-opacity=".20"/>
    </filter>
  </defs>
  <style>
    .ex-float { animation: ex-float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    /* negative delays start each loop already assembled, so first paint is never empty */
    .ex-box   { animation: ex-box 5s ease-in-out infinite; animation-delay: -3.5s; }
    .ex-line  { animation: ex-line 5s ease-out infinite; animation-delay: -3.5s; transform-box: fill-box; transform-origin: 0% 50%; }
    .ex-l2 { animation-delay: -3.15s } .ex-l3 { animation-delay: -2.8s } .ex-l4 { animation-delay: -2.45s }
    .ex-fill  { animation: ex-fill 5s ease-out infinite; animation-delay: -3.5s; transform-box: fill-box; transform-origin: 0% 50%; }
    @keyframes ex-float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    @keyframes ex-box   { 0%,12% { stroke-dashoffset: 300 } 40%,100% { stroke-dashoffset: 0 } }
    @keyframes ex-line  { 0%,15% { transform: scaleX(0); opacity: 0 } 45%,100% { transform: scaleX(1); opacity: 1 } }
    @keyframes ex-fill  { 0%,20% { transform: scaleX(0) } 60%,100% { transform: scaleX(1) } }
    @media (prefers-reduced-motion: reduce) {
      .ex-float, .ex-box, .ex-line, .ex-fill { animation: none }
      .ex-box { stroke-dashoffset: 0 }
    }
  </style>

  <ellipse cx="200" cy="256" rx="150" ry="24" fill="url(#ex-ground)"/>

  <g class="ex-float" filter="url(#ex-sh)">
    <rect x="40" y="66" width="320" height="168" rx="20" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="2"/>

    <!-- clip thumbnail with bounding box -->
    <rect x="58" y="84" width="124" height="94" rx="12" fill="url(#ex-frame)"/>
    <circle cx="96" cy="118" r="13" fill="#4A5566"/>
    <rect x="86" y="134" width="20" height="30" rx="8" fill="#4A5566"/>
    <rect class="ex-box" x="74" y="100" width="46" height="70" rx="5" fill="none"
          stroke="url(#ex-orange)" stroke-width="3" stroke-dasharray="300"/>
    <rect x="150" y="160" width="24" height="10" rx="5" fill="#FE5C01" opacity=".9"/>

    <!-- explanation lines -->
    <rect class="ex-line"       x="200" y="92"  width="140" height="9" rx="4.5" fill="#C6CFDD"/>
    <rect class="ex-line ex-l2" x="200" y="110" width="118" height="9" rx="4.5" fill="#D8DFEA"/>
    <rect class="ex-line ex-l3" x="200" y="128" width="134" height="9" rx="4.5" fill="#D8DFEA"/>
    <rect class="ex-line ex-l4" x="200" y="146" width="86"  height="9" rx="4.5" fill="#E3E8F0"/>

    <!-- confidence meter -->
    <rect x="200" y="176" width="140" height="10" rx="5" fill="#EEF1F6"/>
    <rect class="ex-fill" x="200" y="176" width="126" height="10" rx="5" fill="url(#ex-orange)"/>
    <rect x="200" y="198" width="52" height="8" rx="4" fill="#E3E8F0"/>
  </g>
</svg>
