<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="t-noeng">
  <title id="t-noeng">Rule blocks snapping together into a finished rule</title>
  <defs>
    <linearGradient id="ne-orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9A4D"/><stop offset="1" stop-color="#FE5C01"/>
    </linearGradient>
    <radialGradient id="ne-ground">
      <stop offset="0" stop-color="#B9C4D6" stop-opacity=".40"/>
      <stop offset="1" stop-color="#B9C4D6" stop-opacity="0"/>
    </radialGradient>
    <filter id="ne-sh" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#7C8CA6" flood-opacity=".20"/>
    </filter>
  </defs>
  <style>
    .ne-float { animation: ne-float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    /* negative delays start each loop already assembled, so first paint is never empty */
    .ne-snap  { animation: ne-snap 5s cubic-bezier(.2,1.3,.4,1) infinite; animation-delay: -3.6s; transform-box: fill-box; transform-origin: 50% 50%; }
    .ne-b2 { animation-delay: -3.15s } .ne-b3 { animation-delay: -2.7s }
    .ne-cursor { animation: ne-cursor 5s ease-in-out infinite; animation-delay: -3.6s; }
    .ne-out { animation: ne-out 5s ease-out infinite; animation-delay: -3.6s; transform-box: fill-box; transform-origin: 0% 50%; }
    @keyframes ne-float  { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-5px) } }
    @keyframes ne-snap   { 0%,6% { transform: translateX(46px); opacity: 0 } 26%,100% { transform: translateX(0); opacity: 1 } }
    @keyframes ne-cursor { 0%,10% { transform: translate(38px,-30px) } 30% { transform: translate(0,0) } 55% { transform: translate(22px,34px) } 100% { transform: translate(38px,-30px) } }
    @keyframes ne-out    { 0%,60% { transform: scaleX(0); opacity: 0 } 85%,100% { transform: scaleX(1); opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      .ne-float, .ne-snap, .ne-cursor, .ne-out { animation: none }
      .ne-snap, .ne-out { opacity: 1; transform: none }
    }
  </style>

  <ellipse cx="200" cy="256" rx="140" ry="22" fill="url(#ne-ground)"/>

  <g class="ne-float">
    <g filter="url(#ne-sh)">
      <rect x="62" y="54" width="276" height="192" rx="20" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="2"/>
    </g>

    <!-- WHEN block -->
    <g class="ne-snap">
      <rect x="84" y="78" width="232" height="40" rx="11" fill="#FFF4EC" stroke="#FFD3B4" stroke-width="2"/>
      <rect x="98" y="92" width="46" height="12" rx="6" fill="url(#ne-orange)"/>
      <rect x="156" y="93" width="84" height="10" rx="5" fill="#E6C9B6"/>
    </g>

    <!-- IN block -->
    <g class="ne-snap ne-b2">
      <rect x="84" y="126" width="232" height="40" rx="11" fill="#F1F5FB" stroke="#D8E2F0" stroke-width="2"/>
      <rect x="98" y="140" width="30" height="12" rx="6" fill="#8FA6C6"/>
      <rect x="140" y="141" width="102" height="10" rx="5" fill="#D3DDEB"/>
    </g>

    <!-- THEN block -->
    <g class="ne-snap ne-b3">
      <rect x="84" y="174" width="232" height="40" rx="11" fill="#F1F5FB" stroke="#D8E2F0" stroke-width="2"/>
      <rect x="98" y="188" width="42" height="12" rx="6" fill="#8FA6C6"/>
      <rect x="152" y="189" width="74" height="10" rx="5" fill="#D3DDEB"/>
    </g>

    <!-- plain-english readback -->
    <rect class="ne-out" x="84" y="226" width="180" height="8" rx="4" fill="#E3E8F0"/>

    <!-- cursor -->
    <g class="ne-cursor">
      <path d="M282 150 l0 30 l8 -8 l6 13 l7 -3 l-6 -13 l11 -1 z"
            fill="#2B3340" stroke="#FFFFFF" stroke-width="2.5" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
