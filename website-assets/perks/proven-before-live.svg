<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" role="img" aria-labelledby="t-proven">
  <title id="t-proven">A compliance score filling to a passing grade with a checkmark</title>
  <defs>
    <linearGradient id="pv-orange" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF9A4D"/><stop offset="1" stop-color="#FE5C01"/>
    </linearGradient>
    <radialGradient id="pv-ground">
      <stop offset="0" stop-color="#B9C4D6" stop-opacity=".40"/>
      <stop offset="1" stop-color="#B9C4D6" stop-opacity="0"/>
    </radialGradient>
    <filter id="pv-sh" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7C8CA6" flood-opacity=".20"/>
    </filter>
  </defs>
  <style>
    .pv-float { animation: pv-float 6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    /* negative delays start each loop already assembled, so first paint is never empty */
    .pv-arc   { animation: pv-arc 5s cubic-bezier(.3,.8,.4,1) infinite; animation-delay: -4s; }
    .pv-check { animation: pv-check 5s ease-out infinite; animation-delay: -4s; }
    .pv-step  { animation: pv-step 5s ease-out infinite; animation-delay: -4s; transform-box: fill-box; transform-origin: 0% 50%; }
    .pv-s2 { animation-delay: -3.7s } .pv-s3 { animation-delay: -3.4s }
    @keyframes pv-float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
    @keyframes pv-arc   { 0%,8% { stroke-dashoffset: 408 } 55%,100% { stroke-dashoffset: 41 } }
    @keyframes pv-check { 0%,50% { stroke-dashoffset: 60; opacity: 0 } 62% { opacity: 1 } 78%,100% { stroke-dashoffset: 0; opacity: 1 } }
    @keyframes pv-step  { 0%,30% { transform: scaleX(0); opacity: 0 } 60%,100% { transform: scaleX(1); opacity: 1 } }
    @media (prefers-reduced-motion: reduce) {
      .pv-float, .pv-arc, .pv-check, .pv-step { animation: none }
      .pv-arc { stroke-dashoffset: 41 } .pv-check { stroke-dashoffset: 0; opacity: 1 }
    }
  </style>

  <ellipse cx="200" cy="258" rx="140" ry="22" fill="url(#pv-ground)"/>

  <g class="pv-float">
    <!-- score dial -->
    <g filter="url(#pv-sh)">
      <circle cx="140" cy="150" r="76" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="2"/>
    </g>
    <circle cx="140" cy="150" r="65" fill="none" stroke="#EEF1F6" stroke-width="16"/>
    <circle class="pv-arc" cx="140" cy="150" r="65" fill="none" stroke="url(#pv-orange)"
            stroke-width="16" stroke-linecap="round" stroke-dasharray="408"
            transform="rotate(-90 140 150)"/>
    <path class="pv-check" d="M114 150 l18 19 l35 -40" fill="none" stroke="#FE5C01"
          stroke-width="11" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="60"/>

    <!-- passing step list -->
    <g filter="url(#pv-sh)">
      <rect x="238" y="88" width="128" height="124" rx="18" fill="#FFFFFF" stroke="#E3E8F0" stroke-width="2"/>
    </g>
    <g class="pv-step">
      <circle cx="266" cy="118" r="9" fill="#FFF1E7"/>
      <path d="M262 118 l3 3 l6 -7" fill="none" stroke="#FE5C01" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="284" y="113" width="62" height="9" rx="4.5" fill="#D8DFEA"/>
    </g>
    <g class="pv-step pv-s2">
      <circle cx="266" cy="150" r="9" fill="#FFF1E7"/>
      <path d="M262 150 l3 3 l6 -7" fill="none" stroke="#FE5C01" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="284" y="145" width="48" height="9" rx="4.5" fill="#D8DFEA"/>
    </g>
    <g class="pv-step pv-s3">
      <circle cx="266" cy="182" r="9" fill="#FFF1E7"/>
      <path d="M262 182 l3 3 l6 -7" fill="none" stroke="#FE5C01" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="284" y="177" width="56" height="9" rx="4.5" fill="#D8DFEA"/>
    </g>
  </g>
</svg>
