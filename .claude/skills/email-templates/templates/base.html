<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office" lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{SUBJECT}}</title>
  <!--[if mso]>
  <noscript><xml><o:OfficeDocumentSettings>
    <o:PixelsPerInch>96</o:PixelsPerInch>
  </o:OfficeDocumentSettings></xml></noscript>
  <![endif]-->
  <style>
    :root { color-scheme: light dark; supported-color-schemes: light dark; }
    body, table, td, a { -webkit-text-size-adjust:100%; -ms-text-size-adjust:100%; }
    table, td { mso-table-lspace:0pt; mso-table-rspace:0pt; }
    img { -ms-interpolation-mode:bicubic; border:0; outline:none; text-decoration:none; }
    a { color:#f9681f; }

    @media only screen and (max-width:600px) {
      .container { width:100% !important; }
      .stack     { display:block !important; width:100% !important; }
      .px        { padding-left:20px !important; padding-right:20px !important; }
    }

    @media (prefers-color-scheme: dark) {
      .email-bg   { background-color:#121212 !important; }
      .email-card { background-color:#171717 !important; }
      .t-body     { color:#f2f2f2 !important; }
      .t-muted    { color:#999999 !important; }
      .t-heading  { color:#f2f2f2 !important; }
      .hairline   { border-color:#262626 !important; }
      .fill-muted { background-color:#212121 !important; }
      .panel      { background-color:#371606 !important; color:#fcab83 !important; }
      .panel a    { color:#fcab83 !important; }
    }
  </style>
</head>
<body class="email-bg" style="margin:0; padding:0; width:100%; background-color:#f7f7f7;">

  <!-- Preheader: inbox preview text. Never leave this empty. -->
  <div style="display:none; max-height:0; overflow:hidden; mso-hide:all; font-size:1px; line-height:1px; color:#f7f7f7; opacity:0;">
    {{PREHEADER}}
    &#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;&#8203;
  </div>

  <table role="presentation" class="email-bg" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f7f7f7;">
    <tr>
      <td align="center" style="padding:32px 12px;">

        <table role="presentation" class="container email-card" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px; max-width:600px; background-color:#ffffff; border-radius:6px;">

          <!-- Header -->
          <tr>
            <td class="px" style="padding:32px 40px 0 40px;">
              <img src="{{LOGO_URL}}" width="120" height="28" alt="{{PRODUCT_NAME}}" style="display:block; border:0; width:120px; height:28px;">
            </td>
          </tr>

          <!-- Title -->
          <tr>
            <td class="px t-heading" style="padding:24px 40px 0 40px; font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:24px; line-height:32px; font-weight:700; color:#1a1a1a;">
              {{TITLE}}
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td class="px t-body" style="padding:16px 40px 0 40px; font-family:'Manrope',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:16px; line-height:24px; color:#1a1a1a;">
              {{BODY}}
            </td>
          </tr>

          <!-- CTA -->
          <tr>
            <td class="px" align="left" style="padding:32px 40px 0 40px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td align="center" bgcolor="#f9681f" style="border-radius:6px; border:1px solid #ef5406;">
                    <!--[if mso]>
                    <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml" href="{{CTA_URL}}" style="height:44px;v-text-anchor:middle;width:220px;" arcsize="14%" stroke="f" fillcolor="#f9681f">
                      <w:anchorlock/>
                      <center style="color:#ffffff;font-family:Arial,sans-serif;font-size:16px;font-weight:bold;">{{CTA_LABEL}}</center>
                    </v:roundrect>
                    <![endif]-->
                    <!--[if !mso]><!-- -->
                    <a href="{{CTA_URL}}" style="display:inline-block; padding:13px 28px; font-family:'Manrope',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:16px; line-height:18px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:6px;">{{CTA_LABEL}}</a>
                    <!--<![endif]-->
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Fallback link: some clients strip button styling entirely -->
          <tr>
            <td class="px t-muted" style="padding:16px 40px 0 40px; font-family:'Manrope',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:18px; color:#666666;">
              If the button doesn&#39;t work, paste this into your browser:<br>
              <a href="{{CTA_URL}}" style="color:#f9681f; word-break:break-all;">{{CTA_URL}}</a>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td class="px" style="padding:32px 40px 0 40px;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr><td class="hairline" height="1" style="height:1px; line-height:1px; font-size:0; border-top:1px solid #d9d9d9;">&nbsp;</td></tr>
              </table>
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td class="px t-muted" style="padding:24px 40px 40px 40px; font-family:'Manrope',-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:18px; color:#666666;">
              You&#39;re receiving this because of activity on your {{PRODUCT_NAME}} account.<br>
              <a href="{{PREFERENCES_URL}}" style="color:#666666; text-decoration:underline;">Notification preferences</a>
              &nbsp;&middot;&nbsp;
              <a href="{{HELP_URL}}" style="color:#666666; text-decoration:underline;">Help</a>
              <br><br>
              {{COMPANY_NAME}}, {{COMPANY_ADDRESS}}
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
