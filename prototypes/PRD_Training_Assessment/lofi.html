  const el = document.getElementById("modal");
  if (!S.modal) { el.innerHTML = ""; return; }
  if (S.modal === "upload") el.innerHTML = `<div class="scrim" data-act="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mh"><h3 id="mt">Upload CV model</h3><p class="desc">Same form as Model Management. Saved there and reusable by any assessment model.</p></div>
    <div class="mb"><div class="g2">${field("Capability", "up.cap", select("up.cap", ["Action recognition", "Pose estimation", "Object detection", "Person detection & Re-ID"]))}${field("Model title", "up.title", input("up.title"))}</div>
      <div class="fld"><span class="lb">CV model file (.onnx)</span><div class="drop"><span class="badge">ONNX</span><span style="flex:1">${esc(S.up.title.toLowerCase().replace(/[^a-z0-9]+/g, "_"))}.onnx · 48 MB</span><button type="button" class="btn sm">Replace</button></div></div>
      <div class="fld"><span class="lb">Manifest (.json)</span><div class="drop"><span class="badge">JSON</span><span style="flex:1">${esc(S.up.title.toLowerCase().replace(/[^a-z0-9]+/g, "_"))}.manifest.json · 4 KB</span><button type="button" class="btn sm">Replace</button></div></div>
      <div style="max-width:180px">${field("Batch size", "up.batch", input("up.batch"))}</div>
      <div class="note soft" style="flex-direction:column;gap:4px"><b>Read from the manifest</b><span class="hint">Input 640 × 640 · outputs match "${esc(S.up.cap)}"</span><span>✓ Fits "${esc(S.up.cap)}"</span></div></div>
    <div class="mf"><button type="button" class="btn" data-act="closeModal">Cancel</button><button type="button" class="btn pri" data-act="upload">Upload</button></div></div></div>`;
  if (S.modal === "preset") el.innerHTML = `<div class="scrim" data-act="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mh"><h3 id="mt">Create camera preset</h3><p class="desc">Saved in System Configuration › Camera Defaults, so any assessment model can use it. Every deployment is checked against it.</p></div>
    <div class="mb">${field("Preset name", "preset.name", input("preset.name", 'placeholder="e.g. Golf bay · 2 cameras · 240 fps"'))}
      <div class="g2">${field("Cameras per area", "preset.perArea", select("preset.perArea", ["1", "2", "3"]))}${field("Minimum frame rate", "preset.fps", select("preset.fps", ["60 fps", "120 fps", "240 fps"]))}</div>
      <div class="g2">${field("Minimum resolution", "preset.res", select("preset.res", ["720p", "1080p", "4K"]))}${field("Calibration", "preset.cal", select("preset.cal", ["Floor or mat markers", "Known object size", "None"]))}</div>
      <div class="fld"><span class="lb">Positions</span><div class="row">${poseReq().pos.map((x) => `<span class="chip">${esc(x)}</span>`).join("")}<button type="button" class="btn sm">+ Add position</button></div><span class="hint">Each position gets a placement guide: height, distance, sample frame.</span></div></div>
    <div class="mf"><button type="button" class="btn" data-act="closeModal">Cancel</button><button type="button" class="btn pri" data-act="savePreset">Save preset</button></div></div></div>`;
  if (S.modal === "addPerson") el.innerHTML = `<div class="scrim" data-act="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mh"><h3 id="mt">Add ${esc(U.person)}</h3><p class="desc">Required fields come from the model's participant rules: ${esc(U.required.join(", "))}.</p></div>
    <div class="mb">${field("Name", "np.name", input("np.name", 'placeholder="Full name"'))}<div class="g2">${field("Group", "np.group", select("np.group", U.groups))}${field(esc(U.ind.coach), "np.coach", input("np.coach"))}</div>${field(esc(U.required[1]), "np.info", input("np.info"))}
      <label class="row" style="font-size:13px"><input type="checkbox" checked ${U.privacyLocked ? "disabled" : ""}> Consent captured${U.privacyLocked ? " (required)" : ""}</label></div>
    <div class="mf"><button type="button" class="btn" data-act="closeModal">Cancel</button><button type="button" class="btn pri" data-act="addPerson">Add ${esc(U.person)}</button></div></div></div>`;
  if (S.modal === "csv") {
    const c = CSV[S.uc], known = (nm) => S.people.some((p) => p.name === nm);
    const fields = ["Name", ...U.required.filter((r) => r !== "Name" && r !== "Consent"), "Consent"];
    el.innerHTML = `<div class="scrim" data-act="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mh"><h3 id="mt">Import ${esc(U.people)} from CSV</h3><p class="desc">One row per person. Columns are matched to the profile fields this use case needs: ${esc(U.required.join(", "))}.</p></div>
    <div class="mb"><div class="fld"><span class="lb">CSV file</span><div class="drop"><span class="badge">CSV</span><span style="flex:1">${esc(c.file)} · ${c.rows.length} rows</span><button type="button" class="btn sm">Replace</button></div><button type="button" class="link" data-act="soonToast" data-msg="Downloaded ${esc(U.label.toLowerCase())}_participants_template.csv">Download template</button></div>
      <div class="fld"><span class="lb">Match columns</span><div class="card flush"><div class="tw"><table class="tbl"><thead><tr><th>CSV column</th><th>Profile field</th></tr></thead><tbody>
        ${c.cols.map((col) => `<tr><td>${esc(col)}</td><td><select class="in" aria-label="Field for ${esc(col)}">${fields.map((f) => `<option ${f === col ? "selected" : ""}>${esc(f)}</option>`).join("")}</select></td></tr>`).join("")}</tbody></table></div></div></div>
      <div class="fld"><span class="lb">Preview</span><div class="card flush"><div class="tw"><table class="tbl"><thead><tr><th>Name</th><th>Status</th></tr></thead><tbody>
        ${c.rows.map((r) => `<tr><td>${esc(r[0])}</td><td class="hint">${S.csv.ctx === "session" && inSession(r[0]) ? "Already in this session · skipped" : known(r[0]) ? "Already registered · added from their profile" : "New profile"}${r[r.length - 1] === "No" ? " · ✗ no consent, won't be recorded" : ""}</td></tr>`).join("")}</tbody></table></div></div></div>
      ${S.csv.ctx === "session" ? `<label class="row" style="font-size:13px"><input type="checkbox" data-bind="csv.toGroup" ${S.csv.toGroup ? "checked" : ""}> Also add new people to ${esc(S.ns.group)}</label>` : ""}</div>
    <div class="mf"><button type="button" class="btn" data-act="closeModal">Cancel</button><button type="button" class="btn pri" data-act="importCsv">Import ${c.rows.length} ${esc(U.people)}</button></div></div></div>`;
  }
  const first = el.querySelector(".modal input, .modal select");
  if (first) first.focus();
}
function renderToast() { document.getElementById("toast").innerHTML = S.toast ? `<div class="toast" role="status">${esc(S.toast)}</div>` : ""; }

/* ── actions ─────────────────────────────────────────────────────── */
let runTimer = null;
function startTimer() {
  clearInterval(runTimer);
  runTimer = setInterval(() => {
    S.run.progress = Math.min(100, S.run.progress + 5);
    if (route() === "running" || route() === "dashboard") render(true);
    if (S.run.progress >= 100) clearInterval(runTimer);
  }, 300);
}
/* switch the whole prototype to another use case (keeps models, deployments, people) */
function switchUc(k) {
  clearInterval(runTimer);
  S.sessions = S.sessions.filter((s) => s.status !== "Ongoing");
  U = UC[k]; S.uc = k; S.cur = U.modelId;
  Object.assign(S, ucState(U));
}
/* a model from another use case: switch first, so every screen uses its words and values */
const ucFor = (id) => { const m = S.models.find((x) => x.id === id); if (m && m.uc && m.uc !== S.uc) { switchUc(m.uc); toast(`Switched to ${U.full} for ${m.name}`); } return m; };
const ACT = {
  soon: () => toast("Existing Accel module · not part of this prototype"),
  soonToast: (el) => toast(el.dataset.msg),
  uc: (el) => {
    if (el.dataset.v === S.uc) return;
    clearInterval(runTimer);
    S.sessions = S.sessions.filter((s) => s.status !== "Ongoing");
    switchUc(el.dataset.v);
    toast(`Switched to ${U.full}`); render(); renderModal();
  },
  reset: () => { clearInterval(runTimer); S = freshState(S.uc, "dashboard"); toast("Prototype reset"); go("dashboard"); },
  newModel: () => { S.draft = draftFor(U); S.step = 1; go("wizard"); },
  mfilter: (el) => { S.mfilter = el.dataset.v; render(); },
  continueDraft: (el) => { const m = ucFor(el.dataset.id); S.draft = { ...draftFor(U), id: m.id, name: m.name, cat: m.cat }; S.step = m.step || 1; go("wizard"); },
  openModel: (el) => { ucFor(el.dataset.id); S.cur = el.dataset.id; go("model"); },
  editModel: () => { const m = S.models.find((x) => x.id === S.cur); S.draft = { ...draftFor(U), id: m.id, name: m.name, cat: m.cat }; S.step = 1; go("wizard"); },
  toStep: (el) => { S.step = Number(el.dataset.n); render(); window.scrollTo(0, 0); },
  saveDraft: () => {
    const d = S.draft;
    if (d.id) { const m = S.models.find((x) => x.id === d.id); if (m.status === "Draft") { m.step = S.step; m.name = d.name; } }
    else { d.id = "m" + Date.now(); S.models.push({ id: d.id, uc: S.uc, name: d.name || "Untitled model", cat: d.cat, ver: "v1", status: "Draft", step: S.step, deps: "—", edited: "Just now · You" }); }
    toast("Draft saved"); go("models");
  },
  openUpload: () => { S.modal = "upload"; renderModal(); },
  savePreset: () => {
    const nm = S.preset.name.trim() || `${U.Unit} · ${S.preset.perArea} camera${S.preset.perArea === "1" ? "" : "s"} · ${S.preset.fps} · ${S.preset.res}`;
    S.draft.presets.push(nm); S.draft.profile = nm; S.modal = null; renderModal(); toast(`Saved "${nm}" in Camera Defaults`); render();
  },
  closeModal: (el, e) => { if (e && el.classList.contains("scrim") && e.target !== el) return; S.modal = null; renderModal(); },
  upload: () => {
    const d = S.draft, same = S.lib.filter((m) => m.cap === S.up.cap);
    let m = same.find((x) => x.name === S.up.title);
    if (!m) { m = { id: "cvu" + Date.now(), name: S.up.title, cap: S.up.cap, detects: (same.find((x) => d.cvSel[x.id]) || same[0] || { detects: "Read from the manifest" }).detects, up: true }; S.lib.unshift(m); }
    for (const x of same) d.cvSel[x.id] = false; // one model per capability: the upload replaces it
    d.cvSel[m.id] = true;
    S.modal = null; renderModal(); toast(`Uploaded ${m.name} to Model Management · selected for ${m.cap}`); render();
  },
  toggleArea: () => { S.draft.areaDrawn = !S.draft.areaDrawn; render(); },
  calibrate: () => { S.draft.calibrated = true; toast(U.calMsg); render(); },
  addGroup: () => { S.draft.groups.push(`New group ${S.draft.groups.length + 1}`); render(); },
  rmGroup: (el) => { S.draft.groups.splice(Number(el.dataset.i), 1); render(); },
  applies: (el) => { S.draft.applies = el.dataset.v; render(); },
  runTest: () => { S.draft.test = "running"; render(); setTimeout(() => { S.draft.test = "passed"; if (route() === "wizard") render(); }, 1600); },
  saveModel: () => {
    const d = S.draft;
    let m = d.id && S.models.find((x) => x.id === d.id);
    if (m) { m.status = "Configured"; m.name = d.name; if (m.deps !== "—") m.ver = "v" + (Number(m.ver.slice(1)) + 1); m.edited = "Just now · You"; delete m.step; }
    else { m = { id: "m" + Date.now(), uc: S.uc, name: d.name || "Untitled model", cat: d.cat, ver: "v1", status: "Configured", deps: "—", edited: "Just now · You" }; S.models.push(m); }
    S.cur = m.id; toast(`${m.name} saved · Configured`); go("model");
  },
  deployModel: (el) => {
    const m = ucFor(el.dataset.id);
    S.dep.model = el.dataset.id; S.dep.fixed = false; S.dep.short = "pending";
    S.dep.name = el.dataset.id === U.modelId ? U.depName : `${m.name.replace(" Assessment", "")} · ${S.dep.site}`;
    go("deploy");
  },
  fixCam: () => { S.dep.fixed = true; toast(U.fixedMsg); render(); },
  shortFix: (el) => { S.dep.short = el.dataset.v; toast(el.dataset.v === "added" ? "Camera added in Cameras · area passes" : el.dataset.v === "skip" ? "Area skipped" : "Area will run with reduced analysis"); render(); },
  activate: () => {
    const p = S.dep, m = S.models.find((x) => x.id === p.model);
    const failName = U.unitNames[U.failUnit];
    const shortName = U.short ? U.unitNames[U.short.unit] : null;
    const live = U.unitNames.filter((b) => p.units[b] && !(b === failName && !p.fixed) && !(b === shortName && (p.short === "pending" || p.short === "skip")));
    p.reduced = !!shortName && live.includes(shortName) && p.short === "reduced";
    const d = { name: p.name, model: `${m.name.replace(" Assessment", "")} ${m.ver}`, site: p.site, locs: live.join(", "), cams: live.length * U.camsPerUnit, health: p.reduced ? `Active · reduced: ${shortName} (1 of ${U.camsPerUnit} cameras)` : p.units[failName] && !p.fixed ? `! ${failName} not active` : "✓ All good", active: true };
    const i = S.deployments.findIndex((x) => x.name === p.name);
    if (i >= 0) S.deployments[i] = d; else S.deployments.unshift(d);
    if (m.deps === "—") m.deps = "1 site";
    toast(`Activated ${live.length} ${U.unit}${live.length === 1 ? "" : "s"} · ${p.name}`); go("deployments");
  },
  toggleDep: (el) => { const d = S.deployments[Number(el.dataset.i)]; d.active = !d.active; toast(`${d.name} ${d.active ? "reactivated" : "deactivated"}`); render(); },
  newSession: () => { S.ns.step = 1; go("new-session"); },
  nsStep: (el) => { S.ns.step = Number(el.dataset.n); render(); window.scrollTo(0, 0); },
  consent: () => { S.ns.consent = true; const p = S.people.find((x) => x.name === U.session.missing[2]); if (p) p.consent = true; toast(`Consent captured for ${U.session.missing[2]}`); render(); },
  startRun: () => {
    const id = "s" + Date.now();
    S.sessions = S.sessions.filter((s) => s.status !== "Ongoing");
    S.sessions.unshift({ id, uc: S.uc, name: S.ns.name, model: `${modelShort()} v1`, dep: (S.ns.depSel.split(" · ")[0] || U.depName), src: S.ns.src === "live" ? "Live" : "Recorded", people: U.session.count + S.ns.imported.length, time: `${S.ns.date.replace(" 2026", "")} ${S.ns.from}–${S.ns.to}`, status: "Ongoing" });
    S.run = { sid: id, progress: 0 }; S.issues.g4 = false; S.issues.mix = false;
    startTimer(); go("running");
  },
  resolve: () => { S.issues.g4 = true; S.issues.mix = true; toast(S.issues.choice === "assign" ? `${U.run.temp} assigned to ${S.issues.to}` : S.issues.choice === "new" ? `New profile created for ${U.run.temp}` : `${U.run.temp}'s results discarded`); go("running"); },
  complete: () => { const s = S.sessions.find((x) => x.id === S.run.sid); if (s) s.status = "Completed"; S.run.sid = null; toast("Session completed · results ready"); go("results"); },
  finding: (el) => { const f = S.findings.find((x) => x.id === el.dataset.id); f.state = el.dataset.v; render(); },
  phase: (el) => { S.phase = el.dataset.v; render(); },
  pickAtt: (el) => { S.att = el.dataset.v; render(true); },
  attFilter: (el) => { S.attFilter = el.dataset.v; render(true); },
  markBest: (el) => { S.bestAtt = el.dataset.v; toast(`${U.det.item} ${el.dataset.v} marked as the reference ${U.det.item.toLowerCase()}`); render(true); },
  signoff: () => { S.signed = true; toast("Visit signed off"); render(); },
  openReport: (el) => { S.rep.type = el.dataset.t; go("report"); },
  ptab: (el) => { S.ptab = el.dataset.v; render(); },
  pconsent: (el) => { const p = S.people.find((x) => x.id === el.dataset.id); if (p) p.consent = true; toast("Consent captured"); render(); },
  openCsv: (el) => { S.csv = { ctx: el.dataset.ctx, toGroup: true }; S.modal = "csv"; renderModal(); },
  importCsv: () => {
    const c = CSV[S.uc], added = [], before = S.ns.imported.length;
    for (const r of c.rows) {
      const consent = r[r.length - 1] !== "No";
      if (!S.people.some((p) => p.name === r[0])) {
        S.people.unshift({ uc: S.uc, name: r[0], info: `${U.label} · ${r[1]}`, id: U.label.slice(0, 2).toUpperCase() + "-0" + (300 + S.people.length), group: S.csv.ctx === "session" && S.csv.toGroup ? S.ns.group.replace(/ \(.*\)$/, "") : "—", coach: r[c.cols.length - 2] || "—", consent, last: "—" });
        added.push(r[0]);
      }
      if (S.csv.ctx === "session" && !inSession(r[0])) S.ns.imported.push({ name: r[0], consent });
    }
    S.modal = null; renderModal();
    toast(S.csv.ctx === "session" ? `Added ${S.ns.imported.length - before} ${U.people} to the session · ${added.length} new profile${added.length === 1 ? "" : "s"}` : `Imported ${added.length} new ${U.people} · ${c.rows.length - added.length} already registered`);
    render();
  },
  openAddPerson: () => { S.np = { name: "", info: "", group: U.groups[0], coach: "" }; S.modal = "addPerson"; renderModal(); },
  addPerson: () => {
    if (!S.np.name.trim()) { toast("Add a name first"); return; }
    S.people.unshift({ uc: S.uc, name: S.np.name.trim(), info: `${U.label} · ${S.np.info || "—"}`, id: U.label.slice(0, 2).toUpperCase() + "-0" + (300 + S.people.length), group: S.np.group, coach: S.np.coach || "—", consent: true, last: "—" });
    S.modal = null; renderModal(); toast(`${S.np.name.trim()} added`); render();
  },
};

/* ── events ──────────────────────────────────────────────────────── */
document.addEventListener("click", (e) => {
  const g = e.target.closest("[data-go]");
  if (g) { e.preventDefault(); go(g.dataset.go); return; }
  const a = e.target.closest("[data-act]");
  if (a && ACT[a.dataset.act]) ACT[a.dataset.act](a, e);
});
document.addEventListener("input", (e) => {
  const b = e.target.closest("[data-bind]");
  if (b && (b.tagName === "TEXTAREA" || (b.tagName === "INPUT" && b.type !== "checkbox" && b.type !== "radio"))) setP(b.dataset.bind, b.value);
});
document.addEventListener("change", (e) => {
  const b = e.target.closest("[data-bind]");
  if (!b) return;
  if (b.type === "checkbox") setP(b.dataset.bind, b.checked);
  else if (b.type === "radio") {
    if (!b.checked) return;
    if (b.dataset.bind === "ns.uc") { if (b.value !== S.uc) { switchUc(b.value); S.ns.step = 1; toast(`New ${U.label.toLowerCase()} session · pick the site and deployed model`); } render(true); return; }
    setP(b.dataset.bind, b.value);
  }
  else if (b.tagName === "SELECT") {
    if (b.value.startsWith("+ Create camera preset")) { b.value = getP(b.dataset.bind); S.preset = { name: "", perArea: String(poseReq().pos.length), fps: S.draft.fps, res: "1080p", cal: "Floor or mat markers" }; S.modal = "preset"; renderModal(); return; }
    setP(b.dataset.bind, b.value);
    if (b.dataset.bind === "draft.tarea") S.draft.tcams = defaultCams(b.value);
    if (b.dataset.bind === "ns.site") { S.ns.depSel = ""; S.ns.areasFor = ""; }
    if (b.dataset.bind === "draft.poseMode" || b.dataset.bind === "draft.fps") {
      S.draft.profile = presetFor(S.draft); S.draft.tcams = defaultCams(S.draft.tarea);
      const n = poseReq().pos.length; toast(`Camera requirements updated · ${n} camera${n === 1 ? "" : "s"} per ${U.unit}, ${S.draft.fps}`);
    }
    if (b.dataset.bind === "draft.cat") {
      const k = Object.keys(UC).find((x) => UC[x].cat === b.value);
      if (k && k !== S.uc) {
        const { id, name } = S.draft, typed = name !== U.newName;
        switchUc(k); S.draft.id = id; if (typed) S.draft.name = name; S.step = 1;
        toast(`Now a ${U.label.toLowerCase()} model · the next steps use ${U.full} defaults`);
      }
    }
  }
  else return; // text fields are stored on input; no re-render, so typing keeps focus
  if (b.closest(".modal")) renderModal(); else render(true);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.modal) { S.modal = null; renderModal(); } });
window.addEventListener("hashchange", () => { const h = hashRoute(); if (ROUTES[h] && h !== S.route) { S.route = h; render(); window.scrollTo(0, 0); } });

function render(keepScroll) {
  const y = window.scrollY;
  renderNav();
  document.getElementById("page").innerHTML = ROUTES[route()]();
  renderToast();
  if (keepScroll) window.scrollTo(0, y);
}
render();
</script>
