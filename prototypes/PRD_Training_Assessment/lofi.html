<title>Training Assessment Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Accel app shell (sidebar + 48px top bar) framed in the page; one screen at a time, routed on the hash. Lo-fi greys only. */
:root {
  --bg: #ecece8;
  --surface: #ffffff;
  --surface-2: #f6f6f2;
  --line: #d3d3cc;
  --line-2: #e6e6e0;
  --fg: #24241f;
  --muted: #64645c;
  --ph: #dfdfd8;
  --ink: #2a2a25;
  --on-ink: #ffffff;
  --scrim: rgba(24, 24, 20, 0.5);
  --font: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141412; --surface: #1d1d1a; --surface-2: #24241f; --line: #3b3b35; --line-2: #2d2d28;
    --fg: #ecece6; --muted: #a3a39a; --ph: #34342e; --ink: #ecece6; --on-ink: #161613; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141412; --surface: #1d1d1a; --surface-2: #24241f; --line: #3b3b35; --line-2: #2d2d28;
  --fg: #ecece6; --muted: #a3a39a; --ph: #34342e; --ink: #ecece6; --on-ink: #161613; --scrim: rgba(0, 0, 0, 0.6); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font: 400 14px/1.45 var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 24px;
}
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
a { color: inherit; }

.app { max-width: 1480px; margin: 0 auto; display: flex; min-height: 880px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.side { width: 236px; flex: none; background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.logo { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid var(--line-2); font-weight: 700; letter-spacing: 0.06em; }
.logo i { width: 22px; height: 22px; border-radius: 5px; background: var(--ink); display: inline-block; }
.navs { padding: 12px 10px; display: flex; flex-direction: column; gap: 14px; overflow-y: auto; }
.grp { display: flex; flex-direction: column; gap: 2px; }
.gl { font: 600 10px var(--font); letter-spacing: 0.1em; color: var(--muted); padding: 0 8px 4px; display: flex; gap: 6px; align-items: center; }
.gl em { font-style: normal; border: 1px dashed var(--muted); border-radius: 999px; padding: 0 5px; font-size: 9px; }
.ni { appearance: none; border: 0; background: none; text-align: left; display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 6px; font-size: 13px; color: var(--muted); cursor: pointer; width: 100%; }
.ni i { width: 14px; height: 14px; border-radius: 3px; background: var(--line); flex: none; }
.ni.ta { color: var(--fg); }
.ni:hover { background: var(--surface-2); }
.ni[aria-current="page"] { background: var(--ph); color: var(--fg); font-weight: 600; }
.ni[aria-current="page"] i { background: var(--ink); }
.foot-s { margin-top: auto; padding: 12px 16px; border-top: 1px solid var(--line-2); font-size: 11px; color: var(--muted); }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.top { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--surface); border-bottom: 1px solid var(--line); }
.search { flex: 1; display: flex; justify-content: center; }
.search span { width: 100%; max-width: 380px; height: 30px; border: 1px solid var(--line); border-radius: 6px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-size: 12px; color: var(--muted); }
.ic { width: 28px; height: 28px; border-radius: 6px; background: var(--surface-2); border: 0; flex: none; }
.av { width: 28px; height: 28px; border-radius: 50%; background: var(--line); flex: none; }
.reset { appearance: none; border: 1px dashed var(--line); background: none; border-radius: 6px; padding: 4px 8px; font-size: 12px; color: var(--muted); cursor: pointer; }

.page { padding: 24px 28px 48px; display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.ph-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.ph-head > div:first-child { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.crumb { font-size: 12px; color: var(--muted); }
.crumb button { appearance: none; border: 0; background: none; padding: 0; color: var(--muted); text-decoration: underline; cursor: pointer; font-size: 12px; }
h1 { font-size: 24px; font-weight: 700; margin: 0; line-height: 1.2; text-wrap: balance; }
h2 { font-size: 15px; font-weight: 600; margin: 0; }
h3 { font-size: 17px; font-weight: 600; margin: 0; }
.desc { font-size: 13px; color: var(--muted); margin: 0; max-width: 70ch; }
.hint { font-size: 12px; color: var(--muted); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.sb { justify-content: space-between; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.card.flush { padding: 0; }
.card.flush > .row:first-child { padding: 14px 16px 6px; }
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.g3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.span2 { grid-column: span 2; }

.btn { appearance: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--muted); }
.btn.pri { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.btn.sm { height: 28px; padding: 0 9px; font-size: 12px; }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.link { appearance: none; border: 0; background: none; padding: 0; font-size: 12px; color: var(--muted); text-decoration: underline; cursor: pointer; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 8px; white-space: nowrap; }
.chip.dark { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.chip.grey { background: var(--ph); border-color: var(--ph); }
.chip.dash { border-style: dashed; border-color: var(--muted); }
.in { height: 34px; width: 100%; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); padding: 0 10px; font-size: 13px; }
textarea.in { height: 76px; padding: 8px 10px; resize: vertical; }
.fld { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lb { font-size: 13px; font-weight: 600; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
legend { padding: 0; margin-bottom: 6px; }
.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer; background: var(--surface); }
.opt { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: 8px; padding: 12px; font-size: 13px; cursor: pointer; background: var(--surface); }
.opt:has(input:checked) { border: 2px solid var(--ink); padding: 11px; }
.opt b { display: block; }
.note { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 6px; border: 2px solid var(--ink); font-size: 13px; }
.note.soft { border: 1px solid var(--line); background: var(--surface-2); }

.tw { overflow-x: auto; }
.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th { text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); white-space: nowrap; }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tr.hl td { background: var(--surface-2); }
.rowbtn { appearance: none; border: 0; background: none; padding: 0; font-weight: 600; text-decoration: underline; cursor: pointer; text-align: left; }
.sr { position: absolute; left: -9999px; }
.bar { height: 8px; border-radius: 4px; background: var(--ph); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--muted); transition: width 300ms ease; }
.ph { background: var(--ph); border-radius: 6px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tab { appearance: none; border: 0; background: none; font-size: 13px; padding: 8px 12px; border-bottom: 2px solid transparent; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"], .tab[aria-current="page"] { border-bottom-color: var(--ink); color: var(--fg); font-weight: 600; }

/* wizard */
.wiz { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.steps { width: 260px; flex: none; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.stp { appearance: none; border: 0; background: none; display: flex; align-items: center; gap: 10px; padding: 8px 6px; border-radius: 6px; font-size: 13px; text-align: left; cursor: pointer; color: var(--muted); }
.stp b { width: 22px; height: 22px; border-radius: 50%; border: 1.5px dashed var(--muted); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; flex: none; }
.stp.done { color: var(--fg); }
.stp.done b { border: 1.5px solid var(--ink); }
.stp[aria-current="step"] { background: var(--ph); color: var(--fg); font-weight: 600; }
.stp[aria-current="step"] b { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.form { flex: 999 1 520px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 24px; display: flex; flex-direction: column; gap: 20px; }
.grpbox { border: 1px solid var(--line-2); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.gt { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.ffoot { display: flex; justify-content: space-between; gap: 12px; border-top: 1px solid var(--line-2); padding-top: 16px; flex-wrap: wrap; align-items: center; }
.pill-steps { display: flex; gap: 8px; flex-wrap: wrap; }
.ps { font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.ps.on { border: 2px solid var(--ink); color: var(--fg); font-weight: 600; padding: 5px 11px; }
.ps.done { color: var(--fg); }

/* camera views, video */
.view { position: relative; height: 170px; border-radius: 6px; background: var(--ph); overflow: hidden; }
.view .who { position: absolute; left: 46%; top: 28%; width: 8%; height: 48%; border-radius: 12px; background: var(--line); }
.view .area { position: absolute; left: 28%; top: 16%; width: 44%; height: 68%; border: 2px dashed var(--ink); border-radius: 4px; }
.view .tag { position: absolute; left: 8px; top: 6px; font-size: 12px; color: var(--muted); }
.pose { position: absolute; left: 44%; top: 18%; width: 12%; height: 62%; border: 2px dashed var(--ink); border-radius: 16px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.phase { appearance: none; font-size: 12px; border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; background: var(--surface); cursor: pointer; }
.phase[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); border-color: var(--ink); }
.timeline { border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.lane { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 10px; align-items: center; font-size: 12px; }
.track { position: relative; height: 16px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line-2); }
.rec { position: absolute; top: 0; bottom: 0; background: var(--line); }
.sel { position: absolute; top: -4px; bottom: -4px; border: 2px solid var(--ink); border-radius: 4px; }
.fb { display: grid; grid-template-columns: 140px minmax(0, 1fr) 30px; gap: 10px; align-items: center; font-size: 13px; }
.fb .t { height: 10px; border-radius: 5px; background: var(--ph); overflow: hidden; }
.fb .t span { display: block; height: 100%; background: var(--muted); }
.chart { height: 140px; display: flex; align-items: flex-end; gap: 14px; border-bottom: 1px solid var(--line); padding: 0 4px; }
.chart div { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
.chart span { width: 100%; max-width: 44px; background: var(--line); border-radius: 3px 3px 0 0; }
.chart div:last-child span { background: var(--ink); }
.strip { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
.strip > div { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.strip span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.strip b { font-size: 18px; font-variant-numeric: tabular-nums; }
.find { border: 1px solid var(--line-2); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.fund { display: grid; grid-template-columns: minmax(0, 1fr) 34px; gap: 6px; font-size: 13px; }
.fund b { text-align: center; border: 1px solid var(--line); border-radius: 4px; }
.spark { height: 64px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line-2); }
.sheet { width: 100%; max-width: 560px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 32px; display: flex; flex-direction: column; gap: 12px; margin: 0 auto; }
.prev { flex: 999 1 460px; min-width: 0; background: var(--ph); border-radius: 8px; padding: 24px; }

/* session results: attempt timeline, metric tables, signals, compare */
.atl { position: relative; height: 40px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); margin: 4px 0 2px; }
.atl .blk { position: absolute; top: 0; bottom: 0; border-left: 1px dashed var(--line); }
.atl .blk b { position: absolute; left: 5px; top: 3px; font: 500 10px var(--mono); color: var(--muted); white-space: nowrap; }
.mk { position: absolute; top: 20px; width: 12px; height: 12px; margin-left: -6px; padding: 0; border-radius: 3px; border: 1px solid var(--muted); background: var(--surface); cursor: pointer; }
.mk.fault { background: var(--muted); border-color: var(--muted); }
.mk.flag { background: var(--surface); border: 2px dashed var(--ink); }
.mk[aria-pressed="true"] { outline: 2px solid var(--ink); outline-offset: 2px; }
.lgd { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: var(--muted); }
.lgd i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; border: 1px solid var(--muted); margin-right: 5px; }
.lgd i.fault { background: var(--muted); }
.lgd i.flag { border: 1.5px dashed var(--ink); }
.res { font: 500 11px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; white-space: nowrap; }
.res.fail { border-color: var(--ink); background: var(--ink); color: var(--on-ink); }
.res.warn { border-color: var(--ink); }
.sig { border: 1px solid var(--line-2); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
.sig .plot { display: block; width: 100%; height: 76px; background: var(--surface-2); border-radius: 4px; }
.tbl td .sub { display: block; font-size: 11px; color: var(--muted); }

/* modal + toast */
.scrim { position: fixed; inset: 0; background: var(--scrim); display: flex; align-items: flex-start; justify-content: center; padding: 72px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); z-index: 20; overflow-y: auto; }
.modal { width: 100%; max-width: 600px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; display: flex; flex-direction: column; }
.mh { padding: 20px 24px 8px; display: flex; flex-direction: column; gap: 4px; }
.mb { padding: 8px 24px 20px; display: flex; flex-direction: column; gap: 14px; }
.mf { padding: 14px 24px; border-top: 1px solid var(--line-2); display: flex; justify-content: flex-end; gap: 10px; }
.drop { border: 1.5px dashed var(--muted); border-radius: 8px; padding: 12px; display: flex; align-items: center; gap: 10px; font-size: 13px; }
.badge { font: 600 11px var(--mono); border: 1px solid var(--ink); border-radius: 4px; padding: 1px 6px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--on-ink); padding: 10px 16px; border-radius: 8px; font-size: 13px; z-index: 30; max-width: calc(100% - 32px); }

@media (max-width: 1000px) {
  .kpis, .strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g3 { grid-template-columns: 1fr; }
  .span2 { grid-column: auto; }
}
@media (max-width: 860px) {
  .app { flex-direction: column; }
  .side { width: auto; border-right: 0; border-bottom: 1px solid var(--line); }
  .grp.other, .foot-s { display: none; }
  .navs { padding: 8px; }
  .grp.ta { flex-direction: row; flex-wrap: wrap; gap: 4px; }
  .grp.ta .gl { width: 100%; }
  .grp.ta .ni { width: auto; }
  .g2 { grid-template-columns: 1fr; }
  .steps { width: 100%; }
  .page { padding: 18px 14px 40px; }
  .search { display: none; }
  .top { justify-content: flex-end; }
}
@media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }

/* use-case switch in the top bar */
.ucs { display: flex; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 8px; padding: 3px; flex: none; }
.ucs .hint { padding: 0 6px; }
.ucb { appearance: none; border: 0; background: none; font-size: 13px; padding: 4px 10px; border-radius: 6px; cursor: pointer; color: var(--muted); }
.ucb[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); font-weight: 600; }
.kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
.fund { grid-template-columns: minmax(0, 1fr) auto; }
.fund b { padding: 0 6px; min-width: 34px; }
@media (max-width: 860px) { .ucs .hint { display: none; } .top { flex-wrap: wrap; height: auto; padding-block: 8px; } }
</style>

<div class="app">
  <aside class="side" aria-label="Main navigation">
    <div class="logo"><i aria-hidden="true"></i>ACCEL</div>
    <nav class="navs" id="nav"></nav>
    <div class="foot-s">Sigmawave</div>
  </aside>
  <div class="main">
    <header class="top">
      <div class="ucs" id="ucs" role="group" aria-label="Use case"></div>
      <div class="search"><span>Search… <span class="kbd">⌘K</span></span></div>
      <button class="reset" type="button" data-act="reset">Reset</button>
      <button class="ic" type="button" aria-label="Notifications"></button>
      <span class="av" aria-hidden="true"></span>
    </header>
    <main class="page" id="page" aria-live="polite"></main>
  </div>
</div>
<div id="modal"></div>
<div id="toast"></div>

<script>
/* ── helpers ─────────────────────────────────────────────────────── */
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const getP = (p) => p.split(".").reduce((o, k) => (o == null ? o : o[k]), S);
const setP = (p, v) => { const ks = p.split("."); const last = ks.pop(); ks.reduce((o, k) => o[k], S)[last] = v; };
const idOf = (p) => "f-" + p.replace(/[^a-zA-Z0-9]+/g, "-");
const checked = (p) => (getP(p) ? "checked" : "");
const radio = (p, v) => (getP(p) === v ? "checked" : "");
const select = (p, opts, extra = "") => `<select class="in" id="${idOf(p)}" data-bind="${p}" ${extra}>${opts.map((o) => `<option value="${esc(o)}" ${getP(p) === o ? "selected" : ""}>${o === "" ? "— None (optional)" : esc(o)}</option>`).join("")}</select>`;
const input = (p, extra = "") => `<input class="in" id="${idOf(p)}" data-bind="${p}" value="${esc(getP(p))}" ${extra}>`;
const field = (label, p, control) => `<div class="fld"><label class="lb" for="${idOf(p)}">${label}</label>${control}</div>`;
const box = (p, label) => `<label class="chk"><input type="checkbox" data-bind="${p}" ${checked(p)}> ${esc(label)}</label>`;
const kpi = (l, v, h = "") => `<div class="card kpi"><span class="l">${l}</span><span class="v">${v}</span>${h ? `<span class="hint">${h}</span>` : ""}</div>`;
const pf = (v) => v === "pass" ? `<span class="res">Pass</span>` : v === "warn" ? `<span class="res warn">Warn</span>` : v === "fail" ? `<span class="res fail">Fail</span>` : `<span class="hint">—</span>`;
/* one signal chart: target band behind the line, phase markers on top */
const sig = (c) => { const n = Math.max(1, c.pts.length - 1), y = (v) => 76 - (v / 100) * 76;

  const cfg = S.models.filter((m) => m.status === "Configured");
  const n = Object.values(p.units).filter(Boolean).length;
  const col = (num, title, inner, sub = "") => `<section class="card" style="gap:8px"><span class="hint">${num}</span><h2>${title}</h2>${sub ? `<span class="hint">${sub}</span>` : ""}${inner}</section>`;
  return head(`<button data-go="deployments">Active Deployments</button> / Deploy a model`, "Deploy a model", "Same pattern as Model Deployment: pick left to right. The model's saved settings are applied automatically.", `<button class="btn" data-go="deployments">Cancel</button>`) +
    `<div class="kpis" style="align-items:start">
      ${col(1, "Assessment model", cfg.map((m) => `<label class="opt"><input type="radio" name="dm" value="${m.id}" data-bind="dep.model" ${radio("dep.model", m.id)}><span><b>${esc(m.name)}</b><span class="hint">${m.ver} · Configured</span></span></label>`).join("") + `<span class="hint">Drafts can't be deployed.</span>`)}
      ${col(2, "Site", U.sites.map((s) => `<label class="opt"><input type="radio" name="ds" value="${esc(s)}" data-bind="dep.site" ${radio("dep.site", s)}><span><b>${esc(s)}</b><span class="hint">Area: ${esc(U.areaName)}</span></span></label>`).join("") + `<span class="hint">From Site Management.</span>`)}
      ${col(3, "Areas", U.unitNames.map((b) => `<label class="chk"><input type="checkbox" data-bind="dep.units.${b}" ${checked(`dep.units.${b}`)}> ${esc(b)}</label>`).join("") + `<span class="hint">${n} of ${U.unitNames.length} selected · from Site Management</span>`)}
      ${col(4, "Cameras", select("dep.group", [U.camGroup, "+ Create group"]) + `<div class="find"><b>${esc(U.unitNames[0])}</b>${U.unitCams.map((c) => `<span class="hint">${esc(c)}</span>`).join("")}</div>` +
        (U.short ? `<div class="find" style="border-style:dashed"><b>${esc(U.unitNames[U.short.unit])}</b><span class="hint">${esc(U.unitCams[0])}</span><span><b>${esc(U.short.pos)} · no camera in this area</b></span><button type="button" class="link" data-act="soonToast" data-msg="Opens Site › Cameras to add a camera" style="align-self:flex-start">Add camera in Cameras ↗</button></div>` : "") +
        `<span class="hint">Other ${esc(U.unit)}s mapped the same way · live preview per camera</span>`, "The real cameras at this site, from Cameras")}
    </div>
    <section class="card"><div class="row sb" style="align-items:flex-end"><div style="flex:1 1 280px;max-width:360px">${field("Deployment name", "dep.name", input("dep.name"))}</div><button class="btn pri" data-go="verify" ${n ? "" : "disabled"}>Next: Verify deployment</button></div></section>`;
}

function verify() {
  const p = S.dep, m = S.models.find((x) => x.id === p.model);
  const sel = U.unitNames.filter((b) => p.units[b]);
  const failName = U.unitNames[U.failUnit];
  const failing = sel.includes(failName) && !p.fixed;
  const shortName = U.short ? U.unitNames[U.short.unit] : null;
  const shortOn = !!shortName && sel.includes(shortName);
  const sc = p.short;
  const reducedAllowed = !U.fewer.na && S.draft.fewer === "reduced";
  const ok = sel.filter((b) => !(b === failName && failing) && !(b === shortName && (sc === "pending" || sc === "skip")));
  const shortRow = (b) => sc === "added" ? `<tr><td>${esc(b)}</td><td>Both cameras</td><td>✓</td><td>✓</td><td>✓</td><td>✓</td></tr>`
    : `<tr class="hl"><td><b>${esc(b)}</b></td><td><b>${esc(U.short.pos)} · missing</b></td><td colspan="4"><b>✗ Needs ${U.camsPerUnit} cameras, has 1</b>${sc === "reduced" ? " · running reduced" : sc === "skip" ? " · skipped" : ""}</td></tr>`;
  return head(`<button data-go="deployments">Active Deployments</button> / Deploy / Verify`, "Verify & activate", `${esc(m ? m.name : "Model")} ${m ? m.ver : ""} → ${esc(p.site)} · ${sel.length} ${esc(U.unit)}s. Each camera is checked against the model's hardware profile.`, `<button class="btn" data-go="deploy">Back</button>`) +
    `<section class="card"><div class="row sb"><h2>Camera check</h2><div class="row"><button class="btn sm" data-act="soonToast" data-msg="Calibrated all cameras">Calibrate all</button><button class="btn sm" data-act="soonToast" data-msg="Re-checked ${sel.length * U.camsPerUnit} cameras">Re-check</button></div></div>
      <div class="card flush"><div class="tw"><table class="tbl"><thead><tr><th>${esc(U.Unit)}</th><th>Cameras</th><th>Frame rate</th><th>Angle</th><th>Lighting</th><th>Coverage</th></tr></thead><tbody>
      ${sel.map((b) => b === shortName ? shortRow(b) : b === failName && failing ? `<tr class="hl"><td><b>${esc(b)}</b></td><td><b>${esc(U.failCam)}</b></td>${U.failCells.map((c) => `<td>${c.startsWith("✗") ? `<b>${esc(c)}</b>` : esc(c)}</td>`).join("")}</tr>` : `<tr><td>${esc(b)}</td><td>${U.camsPerUnit === 2 ? "Both cameras" : "Side camera"}</td><td>✓ ${esc(U.pose.fps.replace(" fps", ""))}</td><td>✓</td><td>✓</td><td>✓</td></tr>`).join("")}
      </tbody></table></div></div>
      ${shortOn && sc !== "added" ? `<div class="note" style="flex-direction:column;gap:8px"><span>! <b>${esc(shortName)} has 1 of ${U.camsPerUnit} cameras.</b> ${sc === "reduced" ? `It will run with reduced analysis: no ${esc(U.short.loses)}.` : sc === "skip" ? "It's skipped; the other areas can go live." : "Choose what to do:"}</span>
        <div class="row"><button type="button" class="btn sm" data-act="shortFix" data-v="added">Add camera in Cameras, re-check</button><button type="button" class="btn sm" data-act="shortFix" data-v="skip">Skip ${esc(shortName)}</button>${reducedAllowed ? `<button type="button" class="btn sm" data-act="shortFix" data-v="reduced">Run with reduced analysis</button>` : `<span class="hint">Reduced analysis is blocked by this model's camera rule.</span>`}</div></div>` : ""}
      ${failing ? `<div class="note">! <span><b>${esc(failName)} can't be activated.</b> ${esc(U.failFix)} The rest can go live now. <button type="button" class="link" data-act="fixCam">I've fixed it, re-check</button></span></div>` : `<div class="note soft">✓ All selected cameras meet the hardware profile.</div>`}
    </section>
    <section class="card"><h2>Activate</h2><div class="g3">${field("Schedule (optional)", "dep.schedule", select("dep.schedule", U.schedule))}<div class="fld"><span class="lb">Settings applied</span><span>${esc(m ? m.name : "")} ${m ? m.ver : ""}, to every ${esc(U.unit)}</span></div><div class="fld"><span class="lb">Goes live</span><span>${ok.length ? esc(ok.map((b) => b === shortName && sc === "reduced" ? b + " (reduced)" : b).join(", ")) : "Nothing selected"}</span></div></div>
      <div class="ffoot"><span class="hint">You can deactivate or reactivate any ${esc(U.unit)} later.</span><button class="btn pri" data-act="activate" ${ok.length ? "" : "disabled"}>Activate ${ok.length} ${esc(U.unit)}${ok.length === 1 ? "" : "s"}</button></div></section>`;
}

function sessions() {
  const row = (s) => `<tr><td><b>${esc(s.name)}</b><div class="hint">${esc(s.model)}</div></td><td>${esc(s.dep)}</td><td>${esc(s.src)}</td><td>${s.people}</td><td>${esc(s.time)}</td><td>${statusChip(s.status)}</td>
    <td>${s.status === "Completed" && s.uc === S.uc ? `<button class="btn sm" data-go="results">Results</button>` : s.id === S.run.sid ? `<button class="btn sm" data-go="running">Open</button>` : ""}</td></tr>`;
  return head("Training Assessment / Assessment Sessions", "Assessment Sessions", "Lessons, classes and visits analysed from live cameras or existing recordings.", `<button class="btn pri" data-act="newSession">+ New ${esc(U.label.toLowerCase())} session</button>`) +
    `<section class="card flush"><div class="tw"><table class="tbl"><thead><tr><th>Session</th><th>Deployment</th><th>Footage</th><th>People</th><th>Time</th><th>Status</th><th><span class="sr">Open</span></th></tr></thead><tbody>${S.sessions.map(row).join("")}</tbody></table></div></section>`;
}

function newSession() {
  const n = S.ns, ss = U.session;
  const pills = ["Details", "Participants", "Footage"].map((l, i) => `<span class="ps ${i + 1 === n.step ? "on" : i + 1 < n.step ? "done" : ""}">${i + 1 < n.step ? "✓" : i + 1} · ${l}</span>`).join("");
  let body = "", nextOk = true;
  const deps = depsFor(n.site);
  if (!deps.some((d) => depLabel(d) === n.depSel)) n.depSel = deps[0] ? depLabel(deps[0]) : "";
  const dep = deps.find((d) => depLabel(d) === n.depSel);
  if (n.areasFor !== n.depSel) { n.areasFor = n.depSel; n.areas = objOf(areasOf(dep)); }
  const areasOn = Object.keys(n.areas).filter((a) => n.areas[a]);
  if (n.step === 1) nextOk = !!dep && areasOn.length > 0;
  if (n.step === 1) body = `<h3>Details</h3>
    <fieldset><legend class="lb">Use case</legend><div class="g3">${Object.values(UC).map((u) => `<label class="opt"><input type="radio" name="nuc" value="${u.uc}" data-bind="ns.uc" ${S.uc === u.uc ? "checked" : ""}><span><b>${esc(u.label)}</b><span class="hint">${esc(u.full)} · ${esc(u.Units.toLowerCase())}</span></span></label>`).join("")}</div></fieldset>
    <div class="g2">${field("Site", "ns.site", select("ns.site", U.sites))}
      ${dep ? field("Deployed model", "ns.depSel", select("ns.depSel", deps.map(depLabel))) : `<div class="fld"><span class="lb">Deployed model</span><span class="note">! No active ${esc(U.label.toLowerCase())} deployment at ${esc(n.site)}. <button type="button" class="link" data-go="deployments">Open Active Deployments</button></span></div>`}</div>
    ${dep ? `<fieldset><legend class="lb">${esc(U.Units)} · from this deployment</legend><div class="row">${areasOf(dep).map((a) => box(`ns.areas.${a}`, a)).join("")}</div>
      <span class="hint">${areasOn.length} of ${areasOf(dep).length} ${esc(U.Units.toLowerCase())} selected · only these cameras are analysed.</span>${areasOn.length ? "" : `<span class="note">! Pick at least one ${esc(U.unit)}.</span>`}</fieldset>` : ""}
    <div class="g2">${field("Session name", "ns.name", input("ns.name"))}</div>
    <fieldset><legend class="lb">Session type</legend><div class="g2"><label class="opt"><input type="radio" name="nt" value="one" data-bind="ns.type" ${radio("ns.type", "one")}><span><b>${esc(ss.one[0])}</b><span class="hint">${esc(ss.one[1])}</span></span></label><label class="opt"><input type="radio" name="nt" value="group" data-bind="ns.type" ${radio("ns.type", "group")}><span><b>${esc(ss.group[0])}</b><span class="hint">${esc(ss.group[1])}</span></span></label></div></fieldset>
    <div class="g3">${field("Date", "ns.date", input("ns.date"))}${field("From", "ns.from", input("ns.from"))}${field("To", "ns.to", input("ns.to"))}</div>
    <fieldset><legend class="lb">${esc(ss.extraLabel)}</legend><div class="row">${ss.extra.map((c) => box(`ns.extra.${c}`, c)).join("")}</div></fieldset>
    ${field("Focus (optional)", "ns.focus", select("ns.focus", ss.focus))}`;
  if (n.step === 2) {
    nextOk = !(ss.consentHard && !n.consent);
    body = `<div class="row sb"><h3>Participants</h3><div class="row"><button type="button" class="btn" data-act="openCsv" data-ctx="session">Import CSV</button><button type="button" class="btn" data-act="openAddPerson">+ Add person</button></div></div>
    <div class="row" style="align-items:flex-end"><div style="flex:1 1 260px;max-width:360px">${field("Group", "ns.group", select("ns.group", ss.groupOpts))}</div><span class="hint">Unlisted ${esc(U.people)} get temporary IDs during analysis.</span></div>
    <div class="card flush"><div class="tw"><table class="tbl"><thead><tr><th>${esc(U.Person)}</th><th>${esc(U.Unit)}</th><th>Consent</th></tr></thead><tbody>
      ${ss.roster.map(([nm, u]) => `<tr><td>${esc(nm)}</td><td>${esc(u)}</td><td>✓ On file</td></tr>`).join("")}
      ${n.imported.map((p) => `<tr><td>${esc(p.name)} <span class="chip">From CSV</span></td><td class="hint">Any</td><td>${p.consent ? "✓ On file" : `<b>✗ Missing</b> <span class="hint">won't be recorded</span>`}</td></tr>`).join("")}
      <tr class="${n.consent ? "" : "hl"}"><td>${esc(ss.missing[0])}</td><td>${esc(ss.missing[1])}</td><td>${n.consent ? "✓ Captured just now" : `<b>✗ Missing</b> <button type="button" class="btn sm" data-act="consent">Capture consent</button>`}</td></tr>
      <tr><td class="hint">${esc(ss.more)}</td><td class="hint">Any</td><td>✓ On file</td></tr></tbody></table></div></div>
    ${n.consent ? `<div class="note soft">✓ Everyone in the session has consent on file.</div>` : ss.consentHard
      ? `<div class="note">! <span><b>${esc(ss.missing[2])} has no consent on file.</b> Clinical rule: you can't continue until consent is captured or the patient is removed from this session.</span></div>`
      : `<div class="note">! <span><b>${esc(ss.missing[2])} has no consent on file.</b> They won't be recorded or analysed until consent is captured. The rest can go ahead.</span></div>`}`;
  }
  if (n.step === 3) body = `<h3>Live or recorded?</h3>
    <div class="g2"><label class="opt"><input type="radio" name="src" value="live" data-bind="ns.src" ${radio("ns.src", "live")}><span><b>Live</b><span class="hint">Analyse the cameras while the session runs.</span></span></label><label class="opt"><input type="radio" name="src" value="recorded" data-bind="ns.src" ${radio("ns.src", "recorded")}><span><b>Recorded</b><span class="hint">Pick footage the VMS already recorded. No start or stop needed.</span></span></label></div>
    ${n.src === "recorded" ? `<div class="fld"><span class="lb">Recordings · ${esc(n.date)}</span><div class="timeline" role="img" aria-label="Recordings per camera with the chosen time range selected">
      ${ss.lanes.map((l, i) => `<div class="lane"><span class="${i === ss.lanes.length - 1 ? "hint" : ""}">${esc(l)}</span><div class="track"><div class="rec" style="left:0;${i === 2 ? "width:70%" : "right:0"}"></div><div class="sel" style="left:25%;width:37.5%"></div></div></div>`).join("")}
      <div class="lane"><span></span><div class="row sb hint">${ss.axis.map((a) => `<span>${a}</span>`).join("")}</div></div></div></div>
      <span class="hint">${esc(n.from)}–${esc(n.to)} · ${ss.cams} cameras · split into clips by the NVR's max length per video.</span>` : `<div class="note soft">Analysis starts when you press Start and runs until you complete the session.</div>`}`;
  return head(`<button data-go="sessions">Assessment Sessions</button> / New session`, `New ${esc(U.label.toLowerCase())} session`, "", "") +
    `<div class="pill-steps">${pills}</div>
    <form class="form" style="max-width:920px" onsubmit="return false">${body}
      <div class="ffoot">${n.step > 1 ? `<button type="button" class="btn" data-act="nsStep" data-n="${n.step - 1}">Back</button>` : `<button type="button" class="btn" data-go="sessions">Cancel</button>`}
      ${n.step < 3 ? `<button type="button" class="btn pri" data-act="nsStep" data-n="${n.step + 1}" ${nextOk ? "" : "disabled"}>Next: ${["", "Participants", "Footage"][n.step]}</button>` : `<button type="button" class="btn pri" data-act="startRun">${n.src === "live" ? "Start" : "Run analysis"}</button>`}</div></form>`;
}

function running() {
  const s = S.sessions.find((x) => x.id === S.run.sid);
  if (!s) return head("Assessment Sessions", "No session running", `Start a ${esc(U.label.toLowerCase())} session to see it analyse.`, `<button class="btn pri" data-act="newSession">+ New session</button>`);
  const p = S.run.progress, done = p >= 100, r = U.run;
  const open = (S.issues.g4 ? 0 : 1) + (S.issues.mix ? 0 : 1);
  const blocked = r.mustAssign && !S.issues.g4;
  const row = ([nm, u, n], i) => { const pct = Math.min(100, Math.round(p * [1.6, 1.4, 1][i])); return `<tr><td>${esc(nm)}</td><td>${esc(u)}</td><td>${n}</td><td>${pct}%</td><td>${pct >= 100 ? "✓ Done" : "Analysing"}</td></tr>`; };
  const g4name = S.issues.choice === "assign" ? S.issues.to : S.issues.choice === "new" ? `New ${U.person}` : "Discarded";
  return head(`<button data-go="sessions">Assessment Sessions</button> / ${esc(s.name)}`, `${esc(s.name)} ${statusChip(s.status)}`, `${esc(s.model)} · ${esc(s.dep)} · ${esc(s.src)} · ${s.people} ${esc(U.people)}`,
      `<button class="btn" data-act="soonToast" data-msg="Paused">Pause</button><button class="btn pri" data-act="complete" ${done && !blocked ? "" : "disabled"}>Complete session</button>`) +
    `<section class="card"><div class="row sb"><h2>Analysis progress</h2><span class="hint">${done ? "Finished" : p + "%"}</span></div><div class="bar"><span style="width:${p}%"></span></div>
      <div class="row hint"><span><b>${Math.round(p * 0.9)}</b> ${esc(r.item)} found</span><span><b>${Math.round(p * 0.8)}</b> analysed</span><span>${esc(r.notAnalysed)}</span></div></section>
    <div class="g3"><section class="card flush span2"><div class="row sb"><h2>Per ${esc(U.person)}</h2></div><div class="tw"><table class="tbl"><thead><tr><th>${esc(U.Person)}</th><th>${esc(U.Unit)}</th><th>${esc(r.item[0].toUpperCase() + r.item.slice(1))}</th><th>Progress</th><th>Status</th></tr></thead><tbody>
      ${r.per.map(row).join("")}
      <tr class="${S.issues.g4 ? "" : "hl"}"><td>${S.issues.g4 ? esc(g4name) : `<b>${esc(r.temp)}</b>`}</td><td>${esc(r.tempUnit)}</td><td>${esc(r.tempItems)}</td><td>100%</td><td>${S.issues.g4 ? "✓ Assigned" : "<b>Temporary ID</b>"}</td></tr></tbody></table></div></section>
      <section class="card"><div class="row sb"><h2>Tracking warnings</h2><span class="chip">${open}</span></div>
        ${S.issues.g4 ? "" : `<div class="find">! ${esc(r.temp)} in ${esc(r.tempUnit)} isn't on the list<span class="hint">${esc(r.tempItems)} waiting for a name</span></div>`}
        ${S.issues.mix ? "" : `<div class="find">! ${esc(r.mixWhere)}: ${esc(r.mixWhat)}<span class="hint">${esc(r.mixItems)}</span></div>`}
        ${open ? `<button class="btn" data-go="people">Fix tracking & people</button>` : `<p class="hint">✓ Every result is linked to a known ${esc(U.person)}.</p>`}
      </section></div>
    ${S.dep.reduced && U.short ? `<p class="note soft">! ${esc(U.unitNames[U.short.unit])} runs on one camera: ${esc(U.short.loses)} won't be measured. The same notice shows if a camera drops mid-session.</p>` : ""}
    ${blocked ? `<p class="note">! <span><b>Complete is locked.</b> ${esc(r.keep)}.</span></p>` : done && open ? `<p class="note soft">You can complete now. ${esc(r.keep)}.</p>` : ""}`;
}

function people() {
  const i = S.issues, r = U.run;
  return head(`<button data-go="running">${esc(S.ns.name)}</button> / Fix tracking & people`, "Fix tracking & people", `Make sure every result belongs to the right ${esc(U.person)} before it's shared.`, `<button class="btn pri" data-act="resolve">Done</button>`) +
    `<section class="card"><div class="row sb"><h2>Unknown people · 1</h2><span class="hint">${esc(r.keep)}</span></div>
      <div class="row" style="align-items:flex-start;gap:20px"><div class="fld"><b>${esc(r.temp)} · ${esc(r.tempUnit)}</b><div class="row" aria-hidden="true">${"<div class='ph' style='width:64px;height:48px'></div>".repeat(4)}</div><span class="hint">${esc(r.tempItems)} · ${esc(r.tempTime)}</span></div>
      <fieldset style="flex:1 1 380px;display:flex;flex-direction:column;gap:8px"><legend class="hint">What should happen to ${esc(r.temp)}?</legend>
        <label class="opt" style="align-items:center"><input type="radio" name="g4" value="assign" data-bind="issues.choice" ${radio("issues.choice", "assign")}><span style="flex:1">Assign to an existing ${esc(U.person)}</span><select class="in" style="max-width:200px" aria-label="${esc(U.Person)}" data-bind="issues.to">${r.assignOpts.map((o) => `<option ${i.to === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select></label>
        <label class="opt"><input type="radio" name="g4" value="new" data-bind="issues.choice" ${radio("issues.choice", "new")}><span>Create a new profile (${esc(r.newProfile)})</span></label>
        <label class="opt"><input type="radio" name="g4" value="discard" data-bind="issues.choice" ${radio("issues.choice", "discard")}><span>Discard these results</span></label></fieldset></div></section>
    <section class="card flush"><div class="row sb"><h2>Possible mix-ups · ${esc(r.mixWhere)}</h2><span class="hint">${esc(r.mixWhat)}</span></div>
      <div class="tw"><table class="tbl"><thead><tr><th>When</th><th>Clip</th><th>Linked to now</th><th>Should be</th></tr></thead><tbody>
      ${r.mixRows.map(([t, who], k) => `<tr><td>${esc(t)}</td><td><div class="ph" style="width:64px;height:40px"></div></td><td>${esc(who)}</td><td>${k === 0 ? `<select class="in" aria-label="${esc(U.Person)} for ${esc(t)}" data-bind="issues.mix1">${r.mixPeople.map((o) => `<option ${i.mix1 === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>` : `<span class="hint">Keep</span>`}</td></tr>`).join("")}
      </tbody></table></div></section>`;
}

function results() {
  const R = U.results;
  const max = Math.max(...R.trend), min = Math.min(...R.trend);
  const h = (v) => 40 + ((v - min) / Math.max(1, max - min)) * 80;
  const pending = S.findings.filter((f) => f.state === "pending").length;
  return head("Training Assessment / Results & Reports", esc(S.ns.name), `${esc(modelShort())} v1 · ${esc(S.ns.site || U.sites[0])} · ${esc(S.ns.date)} ${esc(S.ns.from)}–${esc(S.ns.to)}`, `<button class="btn pri" data-act="openReport" data-t="group">Generate report</button>`) +
    `<nav class="tabs" aria-label="Results views"><button class="tab" aria-current="page" data-go="results">Group</button><button class="tab" data-go="individual">Individual</button></nav>
    <div class="kpis">${kpi(...R.kpis[0])}${kpi(...R.kpis[1])}${kpi("Needs review", pending, "Low-confidence findings")}${kpi(...R.kpis[2])}</div>
    <div class="g2"><section class="card"><h2>${esc(R.trendTitle)}</h2><div class="chart" role="img" aria-label="${esc(R.trendTitle)}">${R.trend.map((v) => `<div><span style="height:${h(v)}px"></span>${v}</div>`).join("")}</div><div class="row sb hint"><span>${R.trendFrom}</span><span>${R.trendTo}</span></div></section>
      <section class="card"><h2>${esc(R.faultsTitle)}</h2>${R.faultBars.map(([f, n]) => `<div class="fb"><span>${esc(f)}</span><div class="t"><span style="width:${(n / R.of) * 100}%"></span></div><span>${n}</span></div>`).join("")}</section></div>
    ${S.dep.reduced && U.short ? `<p class="note soft">${esc(U.unitNames[U.short.unit])} ran on one camera. Its ${esc(U.people)} show ${esc(U.short.loses)} as "Not measured · needs 2 cameras", never as zero, and the group score only counts what every area measured.</p>` : ""}

      <div class="tw"><table class="tbl"><thead><tr><th>Camera / hardware</th><th>Status</th><th>Against what the model needs</th><th>Check</th></tr></thead><tbody>
      ${U.det.cams.map(([n, st, spec, chk]) => `<tr><td><b>${esc(n)}</b></td><td>${esc(st)}</td><td>${esc(spec)}</td><td>${pf(chk)}</td></tr>`).join("")}</tbody></table></div>
      <p class="note soft">${esc(U.sess.partial)}</p></section>
    <section class="card flush"><div class="row sb"><h2>${esc(U.Person)}s</h2><span class="hint">${R.noRank ? "Listed by name. Patients aren't ranked or compared with each other." : `Click a ${esc(U.person)} to open their breakdown`}</span></div><div class="tw"><table class="tbl"><thead><tr>${R.cols.map((c) => `<th>${esc(c)}</th>`).join("")}<th>Review</th></tr></thead><tbody>
      ${R.rows.map((rw) => `<tr><td>${rw[0] === U.ind.name ? `<button class="rowbtn" data-go="individual">${esc(rw[0])}</button>` : `<b>${esc(rw[0])}</b>`}</td>${rw.slice(1).map((c) => `<td>${esc(c)}</td>`).join("")}<td>${rw[0] === U.ind.name && pending ? `<span class="chip">${pending} finding</span>` : ""}</td></tr>`).join("")}

}

function individual() {
  const I = U.ind, D = U.det, C = D.compare;
  const att = D.attempts.find((a) => String(a.n) === S.att) || D.attempts[0];
  const metrics = D.metrics[att.kind === "good" ? "good" : "fault"];
  const outside = metrics.filter((m) => m[3] === "fail" || m[3] === "warn").length;
  const shown = D.attempts.filter((a) => S.attFilter === "all" || (S.attFilter === "faults" ? a.kind !== "good" : a.review === "Needs review"));
  const fcard = (f) => `<div class="find"><div class="row sb"><b>${esc(f.name)}</b>${f.state === "pending" ? `<span class="chip">${f.conf}% sure</span>` : f.state === "dismissed" ? `<span class="chip dash">Dismissed</span>` : `<span class="chip dark">${f.state === "corrected" ? "Corrected" : "Confirmed"}</span>`}</div><span class="hint">${esc(f.detail)}</span>
    ${f.state === "pending" ? `<div class="row"><button class="btn sm" data-act="finding" data-id="${f.id}" data-v="confirmed">Confirm</button><button class="btn sm" data-act="finding" data-id="${f.id}" data-v="dismissed">Dismiss</button><button class="btn sm" data-act="finding" data-id="${f.id}" data-v="corrected">Correct</button></div>` : `<button class="link" data-act="finding" data-id="${f.id}" data-v="pending" style="align-self:flex-start">Undo</button>`}</div>`;
  const v = (t) => `<div class="view" style="height:220px"><span class="tag">${esc(t)} · ${esc(D.item)} ${att.n} · ${esc(S.phase)}</span>${S.pose ? `<div class="pose"></div>` : `<div class="who"></div>`}</div>`;
  const pending = S.findings.filter((f) => f.state === "pending").length;
  /* Compare always runs selected vs something else: the selected attempt drops out of
     the list, and when a faulty one is selected the two data columns swap over. */
  const flip = (t) => t.startsWith("+") ? "−" + t.slice(1) : t.startsWith("−") ? "+" + t.slice(1) : t;
  const cmpOpts = [`${D.item} ${D.best} · reference`, ...C.opts].filter((o) => !o.startsWith(`${D.item} ${att.n} `) && o !== `${D.item} ${att.n}`);
  const cmpB = cmpOpts.includes(S.cmpB) ? S.cmpB : cmpOpts[0];
  const cmpRows = C.rows.map((r) => att.kind === "good" ? r : [r[0], r[2], r[1], flip(r[3])]);
  const attSelect = `<select class="in" style="width:auto" aria-label="${esc(D.item)}" data-bind="att">${D.attempts.map((a) => `<option value="${a.n}" ${String(a.n) === S.att ? "selected" : ""}>${esc(D.item)} ${a.n}${a.tag ? ` · ${esc(a.tag)}` : ""}</option>`).join("")}</select>`;
  return head(`<button data-go="results">${esc(S.ns.name)}</button> / ${esc(I.name)}`, esc(I.name), esc(I.sub),
      `<button class="btn" data-go="results">Back to group</button><button class="btn" data-act="soonToast" data-msg="Next ${esc(U.person)}: ${esc(I.next)}">Next ${esc(U.person)}</button><button class="btn" data-act="soonToast" data-msg="Link copied · ${esc(I.name)}">Share</button>${I.signoff ? `<button class="btn" data-act="signoff" ${S.signed ? "disabled" : ""}>${S.signed ? "✓ Signed off" : "Sign off visit"}</button>` : ""}<button class="btn pri" data-act="openReport" data-t="individual">Generate report</button>`) +
    `<nav class="tabs" aria-label="Results views"><button class="tab" data-go="results">Group</button><button class="tab" aria-current="page" data-go="individual">Individual</button></nav>
    <div class="strip">${I.strip.map(([k, val]) => `<div><span>${esc(k)}</span><b>${esc(val)}</b></div>`).join("")}<div><span>To review</span><b>${pending}</b></div></div>

    <section class="card"><div class="row sb"><h2>Session timeline</h2><span class="hint">${esc(D.meta[0][1])} · ${esc(D.meta.find((m) => m[0] === "Analysed") ? D.meta.find((m) => m[0] === "Analysed")[1] : "")}</span></div>
      <div class="atl">${D.blocks.map(([x, l]) => `<div class="blk" style="left:${x}%"><b>${esc(l)}</b></div>`).join("")}
        ${D.attempts.map((a) => `<button type="button" class="mk ${a.kind}" style="left:${a.x}%" data-act="pickAtt" data-v="${a.n}" aria-pressed="${String(a.n) === S.att}" title="${esc(D.item)} ${a.n} · ${esc(a.time)}"><span class="sr">${esc(D.item)} ${a.n} · ${esc(a.time)}</span></button>`).join("")}</div>
      <div class="row sb"><div class="lgd"><span><i></i>Within target</span><span><i class="fault"></i>Fault found</span><span><i class="flag"></i>Flagged for review</span></div><span class="hint">${esc(S.ns.from)} → ${esc(S.ns.to)}</span></div></section>

    <div class="g3"><section class="card span2"><div class="row sb"><h2>${esc(D.item)} video</h2><div class="row">${attSelect}<label class="row hint"><input type="checkbox" data-bind="pose" ${checked("pose")}> Pose</label>${U.uc === "physio" ? `<span class="chip">Face blur on</span>` : ""}</div></div>
      <div class="${I.views.length > 1 ? "g2" : ""}">${I.views.map(v).join("")}</div>
      <div class="row sb"><div class="chips">${I.phases.map((pp) => `<button class="phase" data-act="phase" data-v="${esc(pp)}" aria-pressed="${S.phase === pp}">${esc(pp)}</button>`).join("")}</div><div class="row">${["0.25×", "0.5×", "1×"].map((sp) => `<button class="btn sm" data-act="soonToast" data-msg="Playback ${esc(sp)}">${esc(sp)}</button>`).join("")}<button class="btn sm" data-act="soonToast" data-msg="Frame by frame · ← →">Frame</button><button class="btn sm" data-act="soonToast" data-msg="Line tool: drag on the video">Line</button><button class="btn sm" data-act="soonToast" data-msg="Angle tool: click three points">Angle</button><button class="btn sm" data-act="soonToast" data-msg="Circle and freehand · Clear drawings">Draw</button></div></div></section>
      <section class="card"><h2>Findings</h2>${S.findings.map(fcard).join("")}</section></div>

    <section class="card flush"><div class="row sb"><h2>${esc(D.item)}s</h2><div class="chips">${[["all", "All"], ["faults", "Faults only"], ["flagged", "Flagged"]].map(([k, l]) => `<button class="phase" data-act="attFilter" data-v="${k}" aria-pressed="${S.attFilter === k}">${l}</button>`).join("")}</div></div>
      <div class="tw"><table class="tbl"><thead><tr>${D.cols.map((c) => `<th>${esc(c)}</th>`).join("")}<th>Reference</th></tr></thead><tbody>
      ${shown.map((a) => `<tr class="${String(a.n) === S.att ? "hl" : ""}"><td><button class="rowbtn" data-act="pickAtt" data-v="${a.n}">${esc(D.item)} ${a.n}</button>${a.tag ? `<span class="sub">${esc(a.tag)}</span>` : ""}</td><td>${esc(a.time)}</td>${a.cells.map((c) => `<td>${esc(c)}</td>`).join("")}<td>${esc(a.review)}</td><td>${String(a.n) === S.bestAtt ? `<span class="chip dark">Reference</span>` : `<button class="btn sm" data-act="markBest" data-v="${a.n}">Mark as best</button>`}</td></tr>`).join("")}
      ${shown.length ? "" : `<tr><td colspan="${D.cols.length + 1}"><span class="hint">No ${esc(D.items)} match this filter.</span></td></tr>`}
      </tbody></table></div><div class="row sb"><span class="hint">${esc(D.listNote)}</span><span class="hint">Reviewed: AI only · confirmed · corrected · dismissed</span></div></section>

    <section class="card flush"><div class="row sb"><h2>${esc(D.item)} ${att.n} · every measure</h2><span class="hint">${esc(att.time)} · ${outside ? `${outside} outside target` : "all within target"}</span></div>
      <div class="tw"><table class="tbl"><thead><tr><th>Measure</th><th>This ${esc(D.item.toLowerCase())}</th><th>Target</th><th>Result</th></tr></thead><tbody>
      ${metrics.map(([k, val, t, r]) => `<tr><td><b>${esc(k)}</b></td><td>${esc(val)}</td><td>${esc(t)}</td><td>${pf(r)}</td></tr>`).join("")}</tbody></table></div></section>

    ${D.tables.map(tcard).join("")}

    <section class="card"><div class="row sb"><h2>Signals</h2><span class="hint">${esc(I.signals)} · target band behind the line, markers at each phase</span></div>
      <div class="g2">${D.charts.map(sig).join("")}</div></section>

    <section class="card"><div class="row sb"><h2>Compare</h2><div class="row"><span class="hint">${esc(D.item)} ${att.n} vs</span><select class="in" style="width:auto" aria-label="Compare with" data-bind="cmpB">${cmpOpts.map((o) => `<option ${cmpB === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select><select class="in" style="width:auto" aria-label="Sync point" data-bind="sync">${C.syncs.map((o) => `<option value="${esc(o)}" ${S.sync === o ? "selected" : ""}>Sync at ${esc(o)}</option>`).join("")}</select><label class="row hint"><input type="checkbox" data-bind="overlay" ${checked("overlay")}> Overlay</label></div></div>
      ${S.overlay ? `<div class="view" style="height:220px"><span class="tag">${esc(D.item)} ${att.n} + ${esc(cmpB)} · synced at ${esc(S.sync)}</span><div class="who"></div><div class="pose"></div></div>`
        : `<div class="g2"><div class="view" style="height:220px"><span class="tag">${esc(D.item)} ${att.n} · ${esc(S.sync)}</span><div class="pose"></div></div><div class="view" style="height:220px"><span class="tag">${esc(cmpB)} · ${esc(S.sync)}</span><div class="pose"></div></div></div>`}
      <div class="tw"><table class="tbl"><thead><tr><th>${esc(C.cols[0])}</th><th>${esc(D.item)} ${att.n}</th><th>${esc(cmpB)}</th><th>${esc(C.cols[3])}</th></tr></thead><tbody>
      ${cmpRows.map((r) => `<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join("")}</tbody></table></div></section>

    <div class="g2"><section class="card"><div class="row sb"><h2>${esc(I.fundTitle)}</h2><span class="hint">This session vs last</span></div><div class="fund">${I.fund.map(([k, val]) => `<span>${esc(k)}</span><b>${esc(val)}</b>`).join("")}</div></section>
      <section class="card"><h2>${U.uc === "physio" ? "Home programme" : "Drills"} & notes</h2><div class="find"><b>${esc(I.drill[0])}</b><span class="hint">${esc(I.drill[1])}</span><button class="link" data-act="pickAtt" data-v="${D.attempts.find((a) => a.kind !== "good") ? D.attempts.find((a) => a.kind !== "good").n : att.n}" style="align-self:flex-start">See the clearest example</button></div><button class="btn sm" data-act="soonToast" data-msg="Add your own ${U.uc === "physio" ? "exercise" : "drill"}" style="align-self:flex-start">+ Add</button><label class="hint" for="notes">${esc(I.coach)} notes</label><textarea class="in" id="notes" data-bind="notes">${esc(S.notes)}</textarea></section></div>

    <section class="card"><div class="row sb"><h2>Setup & system status</h2><span class="hint">${esc((D.meta.find((m) => m[0] === "Location") || ["", ""])[1])}</span></div>
      <div class="tw"><table class="tbl"><thead><tr><th>Camera / hardware</th><th>Status</th><th>Against what the model needs</th><th>Check</th></tr></thead><tbody>
      ${D.cams.map(([n, st, spec, chk]) => `<tr><td><b>${esc(n)}</b></td><td>${esc(st)}</td><td>${esc(spec)}</td><td>${pf(chk)}</td></tr>`).join("")}</tbody></table></div>
      <p class="note soft">${esc(D.partial)}</p></section>

    <section class="card"><div class="row sb"><h2>History · last 5 sessions</h2><span class="hint">${esc(I.goal)}</span></div><div class="g3">${I.history.map((hh) => `<div class="fld"><span class="hint">${esc(hh)}</span><div class="spark"></div></div>`).join("")}</div></section>`;
}

function report() {
  const r = S.rep, R = U.report;
  const shown = S.findings.filter((f) => f.state === "confirmed" || f.state === "corrected");
  const pending = S.findings.filter((f) => f.state === "pending").length;
  const needSign = U.ind.signoff && r.type === "individual" && !S.signed;
  const on = (k) => r.sections[k];
  const who = r.type === "group" ? S.ns.name : U.ind.name;
  return head(`<button data-go="${r.type === "group" ? "results" : "individual"}">${esc(who)}</button> / Report`, "Generate report", "",
      `<button class="btn" data-act="soonToast" data-msg="PDF ready in Downloads" ${needSign ? "disabled" : ""}>Export PDF</button><button class="btn" data-act="soonToast" data-msg="${esc(R.extra)} done" ${needSign ? "disabled" : ""}>${esc(R.extra)}</button><button class="btn pri" data-act="soonToast" data-msg="${esc(R.send)} · sent" ${needSign ? "disabled" : ""}>${esc(R.send)}</button>`) +
    `${needSign ? `<div class="note">! <span><b>Sign off the visit first.</b> Clinical reports can't be shared until the clinician signs off. <button class="link" data-go="individual">Go to the visit</button></span></div>` : ""}
    <div class="row" style="align-items:flex-start;gap:20px"><form class="card" style="flex:1 1 280px;max-width:360px" onsubmit="return false"><h2>Report settings</h2>
      <fieldset><legend class="lb">Report</legend><div class="fld"><label class="opt"><input type="radio" name="rt" value="individual" data-bind="rep.type" ${radio("rep.type", "individual")}> ${esc(U.rtypes[0])} · ${esc(U.ind.name)}</label><label class="opt"><input type="radio" name="rt" value="group" data-bind="rep.type" ${radio("rep.type", "group")}> ${esc(U.rtypes[1])} · ${esc(S.ns.name)}</label></div></fieldset>
      <fieldset><legend class="lb">Sections</legend><div class="fld">${Object.keys(r.sections).map((k) => `<label class="row" style="font-size:13px"><input type="checkbox" data-bind="rep.sections.${k}" ${checked(`rep.sections.${k}`)}> ${esc(k)}</label>`).join("")}</div></fieldset>
      <span class="hint">Only confirmed findings are included.${pending ? ` ${pending} still waiting for review.` : ""}</span></form>
    <div class="prev"><article class="sheet" aria-label="Report preview"><div class="row sb hint"><span>ACCEL · ${esc(R.title)}</span><span>${esc(S.ns.date)}</span></div>
      <div class="row sb"><b style="font-size:18px">${esc(who)}</b><b style="font-size:22px">${esc(r.type === "group" ? R.group : R.ind)}</b></div>
      ${Object.keys(r.sections).filter(on).map((k) => /clip/i.test(k) ? `<div class="ph" style="height:140px" role="img" aria-label="${esc(k)}"></div>`
        : /log/i.test(k) ? `<b>${esc(k)}</b>${U.det.attempts.slice(0, 4).map((a) => `<span>• ${esc(U.det.item)} ${a.n} · ${esc(a.time)} · ${a.cells.map(esc).join(" · ")}</span>`).join("")}<span class="hint">The full ${esc(U.det.items)} log is attached as a table.</span>`
        : /fault|measure|score/i.test(k) ? `<b>${esc(k)}</b>${shown.length ? shown.map((f) => `<span>• ${esc(f.name)}</span>`).join("") : `<span class="hint">No confirmed findings yet.</span>`}`
        : /note/i.test(k) ? `<b>${esc(k)}</b><span>${esc(S.notes)}</span>`
        : /progress/i.test(k) ? `<b>${esc(k)}</b><div class="spark"></div>`
        : `<b>${esc(k)}</b><span>• ${esc(U.ind.drill[0])} · ${esc(U.ind.drill[1])}</span>`).join("")}
    </article></div></div>`;
}

function participants() {
  const t = S.ptab;
  const list = [...S.people].sort((a, b) => (a.uc === S.uc ? -1 : 0) - (b.uc === S.uc ? -1 : 0));
  return head("Training Assessment / Participants", "Participants", "Registered people and groups for every use case. Sessions pick from here; walk-ins can be added later.",
      `<button class="btn" data-act="openCsv" data-ctx="page">Import CSV</button><button class="btn pri" data-act="openAddPerson">+ Add ${esc(U.person)}</button>`) +
    `<div class="kpis">${kpi("People", S.people.length)}${kpi("Groups", 8)}${kpi("Missing consent", S.people.filter((p) => !p.consent).length)}${kpi("Unassigned temporary IDs", S.issues.g4 ? 2 : 3, "")}</div>
    <div class="tabs" role="tablist">${[["people", "People"], ["groups", "Groups"], ["unassigned", "Unassigned"]].map(([k, l]) => `<button class="tab" role="tab" aria-selected="${t === k}" data-act="ptab" data-v="${k}">${l}</button>`).join("")}</div>
    ${t === "people" ? `<section class="card flush"><div class="tw"><table class="tbl"><thead><tr><th>Name</th><th>ID</th><th>Group</th><th>Coach / PT / clinician</th><th>Consent</th><th>Last session</th></tr></thead><tbody>
      ${list.map((p) => `<tr><td><b>${esc(p.name)}</b><div class="hint">${esc(p.info)}</div></td><td>${esc(p.id)}</td><td>${esc(p.group)}</td><td>${esc(p.coach)}</td><td>${p.consent ? "✓" : `<button class="btn sm" data-act="pconsent" data-id="${esc(p.id)}">Capture</button>`}</td><td>${esc(p.last)}</td></tr>`).join("")}
      </tbody></table></div></section>` : t === "groups" ? `<div class="g3">${Object.values(UC).flatMap((u) => u.groups).map((g) => `<div class="card"><b>${esc(g)}</b><span class="hint">Group</span></div>`).join("")}</div>`
      : `<section class="card flush"><div class="tw"><table class="tbl"><thead><tr><th>Temporary ID</th><th>Session</th><th>Results</th><th><span class="sr">Action</span></th></tr></thead><tbody>
      ${Object.entries(UC).filter(([k]) => !(k === S.uc && S.issues.g4)).map(([k, u]) => `<tr><td><b>${esc(u.run.temp)}</b></td><td>${esc(u.session.name)}</td><td>${esc(u.run.tempItems)}</td><td>${k === S.uc && S.run.sid ? `<button class="btn sm" data-go="people">Assign</button>` : `<span class="hint">${esc(u.label)}</span>`}</td></tr>`).join("")}</tbody></table></div></section>`}`;
}

const ROUTES = { dashboard, models, wizard, model, deployments, deploy, verify, sessions, "new-session": newSession, running, people, results, individual, report, participants };
for (const k of Object.keys(UC)) UC[k].uc = k;
